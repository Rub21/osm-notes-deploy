name: osm-notes

services:
  db:
    build: ./images/db
    image: osm-notes/db:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Parallel queries during the base load need more than the 64MB default.
    shm_size: 1g
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
    ports:
      - "127.0.0.1:${DB_PUBLIC_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # The scripts use server-side COPY FROM on CSVs under TMP_DIR, so Postgres
      # must see the ingestion temp dir at the same path.
      - ingestion_tmp:/var/tmp/osm-notes-ingestion:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Daemon: on an empty DB it runs processPlanetNotes.sh --base (full history,
  # takes 1-3 hours), then syncs with the OSM API every DAEMON_SLEEP_INTERVAL seconds.
  ingestion:
    build:
      context: ./images/ingestion
      args:
        INGESTION_REPO: ${INGESTION_REPO:-https://github.com/Rub21/OSM-Notes-Ingestion.git}
        INGESTION_REF: ${INGESTION_REF:-fix/daemon-empty-db}
    image: osm-notes/ingestion:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBNAME: ${DBNAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DAEMON_SLEEP_INTERVAL: ${DAEMON_SLEEP_INTERVAL:-60}
      MAX_THREADS: ${MAX_THREADS:-4}
      CLEAN: "true"
      SKIP_XML_VALIDATION: "true"
      SKIP_CSV_VALIDATION: "true"
      DOWNLOAD_USER_AGENT: ${DOWNLOAD_USER_AGENT}
      # Used for boundary updates and the startup check (the base load uses the GitHub backup).
      OVERPASS_INTERPRETER: ${OVERPASS_INTERPRETER:-https://maps.mail.ru/osm/tools/overpass/api/interpreter}
    volumes:
      - ingestion_data:/var/lib/osm-notes-ingestion
      - ingestion_logs:/var/log/osm-notes-ingestion
      - ingestion_tmp:/var/tmp/osm-notes-ingestion


  # One-off job: extracts notes (whole planet) and a sample to label.
  #   docker compose run --rm extractor
  # Output in ./output (sample_<date>.csv and notes_<date>.csv.gz).
  extractor:
    build: ./images/extractor
    image: osm-notes/extractor:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DBNAME}
      SAMPLE_SIZE: ${SAMPLE_SIZE:-1000}
      LANGS: ${LANGS:-es,en,und}
      LABELER_DB_PASSWORD: ${LABELER_DB_PASSWORD}
    volumes:
      - ./output:/output
      - ./sql:/sql:ro

  # Keeps ml.note_lang up to date: detects the language of new notes
  # every WATCH_INTERVAL seconds. Same image as the extractor.
  lang-updater:
    image: osm-notes/extractor:latest
    build: ./images/extractor
    command: ["--watch"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DBNAME}
      LABELER_DB_PASSWORD: ${LABELER_DB_PASSWORD}
      WATCH_INTERVAL: ${LANG_WATCH_INTERVAL:-300}
    volumes:
      - ./sql:/sql:ro

  # Labeling page + API. Needs the ml schema: run the extractor once first.
  # Only on localhost; open it with an SSH tunnel:
  #   ssh -L 8090:127.0.0.1:8090 root@server  ->  http://localhost:8090
  labeler:
    build: ./images/labeler
    image: osm-notes/labeler:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: labeler
      PGPASSWORD: ${LABELER_DB_PASSWORD}
      PGDATABASE: ${DBNAME}
      LABELER_TOKEN: ${LABELER_TOKEN:-}
    ports:
      - "127.0.0.1:${LABELER_PORT:-8090}:8000"

  # Public access to the labeler through a Cloudflare Tunnel (no open ports).
  # In the Cloudflare dashboard, set the tunnel's public hostname to
  # http://labeler:8000 and protect it with Cloudflare Access.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - labeler

volumes:
  pgdata:
  ingestion_data:
  ingestion_logs:
  ingestion_tmp:
