<!doctype html>
<html>
<head><meta charset="utf-8"><title>OSM login</title></head>
<body>
<!-- osm-auth 3.x: send the OAuth answer back to the map page, then close the popup. -->
<script>
  var bc = new BroadcastChannel("osm-api-auth-complete");
  bc.postMessage(window.location.href);
  bc.close();
  window.close();
</script>
</body>
</html>
